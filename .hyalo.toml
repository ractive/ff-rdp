dir = "kb"

[views]

[views.stale-in-progress]
fields = ["tasks"]
properties = ["status=in-progress"]

[views.missing-status]
properties = ["!status"]

[views.missing-type]
properties = ["!type"]

[views.orphans]
fields = ["backlinks"]
orphan = true

[views.completed-with-todos]
fields = ["tasks"]
# Iteration plans use `status=done` (normalized 2026-08-12; `completed` was a
# synonym the merge workflow wrote). kb/research/ still uses `completed`.
properties = ["status=done"]
task = "todo"
