name: Consent probe

# One-off diagnostic, run by hand. Hosted runners are US-geolocated, so
# Sourcepoint serves its US privacy notice there (`cdn.privacy-mgmt.com/us_pm/`)
# while a local run from Europe gets the GDPR variant — the label set in
# `accept_all_js` (crates/ff-rdp-cli/src/commands/consent.rs) was only ever
# observed from Europe (kb/backlog.md, run 37300720298). This job prints every
# frame URL and the button/link labels inside the CMP frame for each site, so
# the regex can be extended from evidence rather than guesses.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to probe
        default: https://www.bbc.com/news https://www.theguardian.com
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Firefox
        uses: browser-actions/setup-firefox@8058e910ee76e74bb76b7b2e5b61a55b3a65ed78 # v1.7.2

      - name: Build ff-rdp
        run: cargo build -p ff-rdp-cli --bins

      - name: Probe CMP frames
        env:
          URLS: ${{ inputs.urls }}
        run: |
          FF=target/debug/ff-rdp
          $FF launch --headless --port 6000
          curl -s https://ifconfig.co/country 2>/dev/null || true; echo
          JS='JSON.stringify({url: location.href, lang: navigator.language, controls: Array.prototype.slice.call(document.querySelectorAll("button, [role=button], a")).map(function(e){ var r=e.getBoundingClientRect(); return {tag:e.tagName, title:e.getAttribute("title"), aria:e.getAttribute("aria-label"), text:(e.textContent||"").trim().slice(0,80), w:r.width, h:r.height}; })})'
          for url in $URLS; do
            echo "=== $url"
            $FF navigate "$url" --jq '.results | {committed_url, status}'
            $FF wait --sleep-ms 4000 >/dev/null
            echo "--- frames (the miss error lists every frame URL):"
            $FF eval --frame "__no_such_frame__" "1" 2>&1 || true
            for sub in privacy-mgmt sourcepoint sp-prod; do
              echo "--- controls in frame matching '$sub':"
              $FF eval --frame "$sub" "$JS" 2>&1 || true
            done
            echo "--- consent accept outcome:"
            $FF consent accept 2>&1 || true
          done
