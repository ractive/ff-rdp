name: CI

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # iter-105 Theme D: pin a job to the declared MSRV (`rust-version` in
  # [workspace.package]) so an accidental use of a newer-than-MSRV stdlib/lang
  # feature is a red check here, not a downstream user's build failure.  Uses
  # the exact MSRV toolchain and only *builds* (compile is the MSRV contract;
  # tests/lints keep running on stable in the jobs above).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.95
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build workspace on MSRV
        run: cargo build --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Allow test binary through Windows Firewall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName "ff-rdp-e2e" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 1024-65535 -ErrorAction SilentlyContinue

      - name: Run tests
        timeout-minutes: 10
        run: cargo test --workspace
      - name: Verify CLI runs
        run: cargo run -p ff-rdp-cli -- --help

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          # libFuzzer requires the gnu (non-musl) toolchain; address-sanitiser
          # is incompatible with musl libc.  Pin explicitly so the runner's
          # default target (which may be musl on some ubuntu-latest images)
          # does not cause a link failure.  See fuzz/README.md.
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz transport_recv_from (60 s)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu transport_recv_from seeds/transport_recv_from -- -max_total_time=60
      - name: Fuzz parse_page_map_str (60 s)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse_page_map_str seeds/parse_page_map_str -- -max_total_time=60
      - name: Fuzz parse_script_file (60 s)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse_script_file seeds/parse_script_file -- -max_total_time=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/

  discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build xtask
        run: cargo build -p xtask
      # iter-162a cut this job from 10 xtask invocations to 3; iter-162b to 2.
      # What went, and why:
      # check-dead-primitives (induced a decoy, missed 425 lines of dead API),
      # check-todo-annotations (guarded an empty set; its pre-commit-hook twin
      # went too), check-oneway-conformance (its own step name said "no-op in CI"),
      # check-discipline-regression (iter-162b — it existed only to keep four
      # copies of two scripts in sync, and those scripts are gone),
      # check-firefox-refs (same — it needs a Firefox checkout no runner has; kept
      # as a local gate, it is the best one in the repo), and check-actor-kb-sync
      # (a docs-sync reminder, now local-only). check-daemon-locks,
      # check-error-envelope-paths and check-stderr-annotations were merged into
      # check-source-invariants — same three scans, one step, named results.
      - name: Check live-test layout (single consolidated target)
        # iter-100b: fails if any top-level crates/ff-rdp-cli/tests/live_*.rs
        # binary reappears. Live suites must be modules of tests/live/main.rs so
        # a plain `cargo test` links one live target instead of ~45.
        run: cargo run -p xtask -- check-live-test-layout
      - name: Check source invariants (daemon locks, error envelope, stderr annotations)
        # Three regex scans of product source, each with its own named result line:
        #   daemon-locks (iter-63)          — no `.lock().unwrap()` under daemon/;
        #                                     use lock_or_recover! so a poisoned
        #                                     mutex doesn't kill the process.
        #   error-envelope-paths (iter-145) — no eprintln! immediately followed by
        #                                     AppError::Exit(N), the bypass that let
        #                                     click-time JS exceptions skip the JSON
        #                                     error envelope.
        #   stderr-annotations (iter-148)   — every eprintln! under commands/ carries
        #                                     a `// stderr-ok: <reason>` comment.
        run: cargo run -p xtask -- check-source-invariants
      - name: Check the bundled skill is not stale (iter-212)
        # The command-reference region of skills/ff-rdp-debug/SKILL.md is
        # generated from crates/ff-rdp-cli/src/commands/skill_doc.rs — the same
        # tables the no-args home view reads. This fails when the committed
        # region and the generator disagree, so the agent-facing skill cannot
        # quietly describe a CLI that no longer exists.
        # Fix: cargo run -p xtask -- gen-skill
        run: cargo run -p xtask -- check-skill-drift

  # iter-75c: PR-time smoke that proves `gh attestation verify` will succeed
  # against a freshly built artifact. Builds the Linux x86_64 CLI, runs
  # actions/attest-build-provenance against it, then re-runs the same
  # `gh attestation verify <file> --owner ractive` invocation that release
  # consumers use. Catches mis-wired permissions, OIDC token scope changes,
  # or a Sigstore transparency-log regression before they reach a tagged
  # release. Skipped on fork PRs (no OIDC token).
  verify-attestation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build ff-rdp-cli (release)
        run: cargo build -p ff-rdp-cli --release --target x86_64-unknown-linux-gnu
      - name: Package artifact
        run: |
          set -euo pipefail
          tar czf ff-rdp-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release ff-rdp
          ls -la ff-rdp-x86_64-unknown-linux-gnu.tar.gz
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ff-rdp-x86_64-unknown-linux-gnu.tar.gz
      - name: Verify attestation end-to-end
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Offline path: verify the bundle the attest action just produced.
          # Catches any local mis-config (wrong subject digest, malformed
          # bundle) before the transparency log is involved.
          gh attestation verify ff-rdp-x86_64-unknown-linux-gnu.tar.gz \
            --owner ractive \
            --bundle "${{ steps.attest.outputs.bundle-path }}"
          # Online path: round-trip through GitHub's attestation API the
          # same way a release consumer does. This is the actual smoke
          # check — if this fails on a no-op PR, the release would too.
          gh attestation verify ff-rdp-x86_64-unknown-linux-gnu.tar.gz \
            --owner ractive
