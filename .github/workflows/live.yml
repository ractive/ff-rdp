name: Live Tests

# The live-Firefox sweep is not a per-PR gate (2026-10-02 reset,
# kb/research/step-back-2026-10-02.md §5). It runs nightly on `main`, on
# demand, and at release. A red nightly gets one GitHub issue; a test that
# fails and passes on one re-run is quarantined with
# `#[ignore = "flaky: issue #N"]` — never an iteration plan.
#
# Third-party-site tests (BBC, Guardian, HN, Wikipedia, MDN, …) additionally
# need FF_RDP_LIVE_SITES_TESTS=1 and run only in the weekly `sites` job: those
# pages change and go down on their own schedule.
on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    # Nightly sweep.
    - cron: "0 3 * * *"
    # Weekly third-party-site canary (Monday).
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  FF_RDP_LIVE_TESTS: "1"
  FF_RDP_LIVE_NETWORK_TESTS: "1"

jobs:
  live-tests:
    # Every trigger except the weekly sites cron.
    if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Firefox
        uses: browser-actions/setup-firefox@8058e910ee76e74bb76b7b2e5b61a55b3a65ed78 # v1.7.2

      - name: Verify Firefox installation
        run: firefox --version

      - name: Build ff-rdp
        run: cargo build -p ff-rdp-cli -p xtask --bins

      - name: Run the live sweep (default parallelism)
        # `live-sweep` reports env-gated tests as `ignored` instead of a fake
        # `ok`, and runs targets that launch their own Firefox at its default
        # `--jobs`.
        run: cargo run -p xtask -- live-sweep

  sites:
    # Weekly cron, or by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-latest
    env:
      FF_RDP_LIVE_SITES_TESTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Firefox
        uses: browser-actions/setup-firefox@8058e910ee76e74bb76b7b2e5b61a55b3a65ed78 # v1.7.2

      - name: Build ff-rdp
        run: cargo build -p ff-rdp-cli -p xtask --bins

      - name: Run the third-party-site tests
        # Same sweep with the sites gate set; the local-fixture tests run too,
        # which keeps this job a single command.
        run: cargo run -p xtask -- live-sweep
