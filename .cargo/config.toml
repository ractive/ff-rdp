[alias]
# Run the full test suite including live (Firefox-dependent) tests.
# Requires FF_RDP_LIVE_TESTS=1 at runtime; Firefox must be available.
# `--test-threads=1` because live tests interfere across threads (daemon
# stop/kill and profile-prune tests collide with concurrently launched
# Firefox instances) — same setting the CI live lane and the iter-110 sweep
# baseline use.
# Usage: FF_RDP_LIVE_TESTS=1 cargo test-live
test-live = "test --workspace -- --include-ignored --test-threads=1"

# Link the C runtime statically into Windows MSVC binaries, so `ff-rdp.exe`
# does not import VCRUNTIME140.dll. That DLL ships with the VC++
# Redistributable, not with Windows, and winget/Scoop/zip users without it
# could not start the binary. `ring` builds its C code through `cc`, which
# honours `crt-static`. An env `RUSTFLAGS` would replace this setting; no CI
# or release workflow sets one.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
